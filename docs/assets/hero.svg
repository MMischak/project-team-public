<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">Project Team — the right agent for the right task</title><desc id="desc">A local workspace to choose an AI team, match capability to work and make token usage visible.</desc><rect width="1280" height="420" rx="28" fill="#f7f6ef"/><circle cx="1180" cy="20" r="250" fill="#e4ecdd"/><circle cx="1240" cy="400" r="200" fill="#e4ecdd"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="40" width="154" height="29" rx="14" fill="#e3ebdc"/><text x="125" y="60" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#315e47">PROJECT TEAM</text><text x="48" y="135" font-size="49" font-weight="700" letter-spacing="-2" fill="#223b30">The right agent.</text><text x="48" y="193" font-size="49" font-weight="700" letter-spacing="-2" fill="#223b30">The right task.</text><text x="48" y="251" font-size="21" fill="#5f7063">Build an AI team around the work.</text><text x="48" y="283" font-size="21" fill="#5f7063">Match capability. Make tokens visible.</text><g font-size="12" letter-spacing="1.2" font-weight="700" fill="#315e47"><text x="48" y="365">LOCAL WORKSPACE</text><text x="227" y="365">HUMAN STEERING</text><text x="407" y="365">USABLE OUTPUTS</text></g><g stroke="#78917a" stroke-width="2" fill="none"><path d="M765 172v76m0-38h300m0-38v76"/></g><g fill="#fffef8" stroke="#cdd8c6"><rect x="675" y="73" width="180" height="96" rx="18"/><rect x="970" y="73" width="180" height="96" rx="18"/><rect x="675" y="251" width="180" height="96" rx="18"/><rect x="970" y="251" width="180" height="96" rx="18"/></g><g font-size="12" fill="#7d887b" letter-spacing="2"><text x="695" y="102">YOUR TEAM</text><text x="990" y="102">YOUR CONTROL</text></g><g fill="#223b30" font-size="22" font-weight="700"><text x="695" y="139">Manager</text><text x="990" y="139">Milestones</text><text x="695" y="292">Builder</text><text x="990" y="292">Reviewer</text></g><g font-size="13" fill="#657463"><text x="695" y="321">Focused execution</text><text x="990" y="321">Independent checks</text></g><rect x="829" y="188" width="175" height="44" rx="22" fill="#ed755e"/><text x="916" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#fffdf6">One shared goal</text></g></svg>
