<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Tinkrew — give every task the right teammate</title>
  <desc id="description">A local AI crew with a manager, builders and reviewers. Choose capabilities, see usage and review results.</desc>
