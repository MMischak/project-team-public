    <text x="48" y="152" font-size="30" font-weight="600" letter-spacing="-.7" fill="#253750">Give every task the right teammate.</text>
    <text x="48" y="196" font-size="19" fill="#64738b">Choose the model. See the usage. Review the result.</text>
