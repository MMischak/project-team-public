<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">A team built around the work</title><desc id="desc">Three abstract agent stations connect a plan, a deliverable and an independent review.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d7e0d1" stroke-width=".7"/></pattern></defs><rect width="1200" height="600" fill="#eaf0e2"/><rect width="1200" height="600" fill="url(#grid)"/><circle cx="1080" cy="80" r="170" fill="#d7e5cf"/><circle cx="90" cy="590" r="200" fill="#d7e5cf"/><g stroke="#51745b" stroke-width="3" fill="none" stroke-dasharray="9 9"><path d="M290 290H910"/></g><g fill="#fffdf6" stroke="#ced7c7" stroke-width="2"><rect x="100" y="130" width="280" height="325" rx="22"/><rect x="460" y="130" width="280" height="325" rx="22"/><rect x="820" y="130" width="280" height="325" rx="22"/></g><g font-family="Arial,sans-serif" fill="#244c3b"><text x="128" y="172" font-size="15" letter-spacing="3">01 / PLAN</text><text x="488" y="172" font-size="15" letter-spacing="3">02 / BUILD</text><text x="848" y="172" font-size="15" letter-spacing="3">03 / REVIEW</text></g><g><rect x="157" y="200" width="166" height="118" rx="25" fill="#dbe8d1"/><rect x="517" y="200" width="166" height="118" rx="25" fill="#fae0d5"/><rect x="877" y="200" width="166" height="118" rx="25" fill="#dde8e7"/></g><g stroke="#244c3b" stroke-width="6" fill="none" stroke-linecap="round"><path d="M202 235h70m-70 20h50m-50 20h60"/><path d="m564 237-20 20 20 20m72-40 20 20-20 20m-29-47-14 54"/><circle cx="957" cy="253" r="30"/><path d="m942 253 11 12 22-25"/></g><g font-family="Arial,sans-serif" fill="#244c3b" font-size="24" font-weight="700"><text x="128" y="365">Clear direction</text><text x="488" y="365">Focused work</text><text x="848" y="365">Fresh perspective</text></g><g font-family="Arial,sans-serif" fill="#657463" font-size="16"><text x="128" y="395">A scope the team can follow.</text><text x="488" y="395">A model that fits the task.</text><text x="848" y="395">An output you can trust.</text></g><g fill="#ee745d"><circle cx="420" cy="291" r="9"/><circle cx="780" cy="291" r="9"/></g><rect x="415" y="503" width="370" height="44" rx="22" fill="#244c3b"/><text x="600" y="531" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#fffdf6">Different roles. One shared outcome.</text></svg>
