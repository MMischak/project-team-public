name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:publication
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify and run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          scanner_dir=$(mktemp -d)
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" --output "${scanner_dir}/${archive}"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" --output "${scanner_dir}/checksums.txt"
          (cd "${scanner_dir}" && awk -v archive="${archive}" '$2 == archive { print }' checksums.txt | sha256sum --check)
          tar -xzf "${scanner_dir}/${archive}" -C "${scanner_dir}" gitleaks
          "${scanner_dir}/gitleaks" git --redact --no-banner --ignore-gitleaks-allow --log-opts="--all" .
